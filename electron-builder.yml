appId: com.untasker.markdownreader
productName: Markdown Reader

directories:
  output: /var/tmp/markdown-reader-build
  buildResources: build-assets

files:
  - dist/**/*
  - package.json

afterPack: ./scripts/strip-xattrs.js

asar: true
asarUnpack:
  - "**/*.node"

fileAssociations:
  - ext: md
    name: Markdown Document
    role: Viewer
    mimeType: text/markdown
  - ext: markdown
    name: Markdown Document
    role: Viewer
    mimeType: text/markdown

publish:
  provider: generic
  url: https://software.untasker.com/releases/

mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: entitlements.plist
  entitlementsInherit: entitlements.plist
  notarize: true

dmg:
  title: Markdown Reader ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
